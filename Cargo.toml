[package]
name = "ra-multiplex"
version = "0.2.6"
description = "share one language server instance between multiple LSP clients to save resources"
repository = "https://codeberg.org/p2502/lspmux"
license = "EUPL-1.2"
edition = "2021"

[dependencies]
anyhow = "1.0.53"
clap = { version = "4.3.0", features = ["derive", "env"] }
directories = "4.0.1"
percent-encoding = "2.3.1"
pin-project-lite = "0.2.14"
serde = { version = "1.0.186", features = ["derive"] }
serde_json = "1.0.78"
time = "0.3.30"
tokio = { version = "1.37.0", features = ["io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "0.5.8"
tracing = "0.1.39"
tracing-subscriber = { version = "0.3.17", features = ["env-filter"] }
uriparse = "0.6.4" 
